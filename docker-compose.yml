services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pdcdemscheckin
      POSTGRES_USER: pdc
      POSTGRES_PASSWORD: pdc
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdc -d pdcdemscheckin"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      PDC_ENVIRONMENT: production
      PDC_DATABASE_URL: postgresql+psycopg://pdc:pdc@db:5432/pdcdemscheckin
      PDC_PUBLIC_BASE_URL: ${PDC_PUBLIC_BASE_URL:-http://localhost:8000}
      PDC_SESSION_SECRET: ${PDC_SESSION_SECRET:-local-compose-secret-change-for-production}
      PDC_GOOGLE_CLIENT_ID: ${PDC_GOOGLE_CLIENT_ID:-}
      PDC_GOOGLE_CLIENT_SECRET: ${PDC_GOOGLE_CLIENT_SECRET:-}
      PDC_ADMIN_ALLOWLIST: ${PDC_ADMIN_ALLOWLIST:-organizer@example.com}
      PDC_SECURE_COOKIES: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
